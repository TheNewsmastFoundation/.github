name: Feature or change request
description: Suggest a new feature, improvement or change.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve, and who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client / instance
      placeholder: "e.g. L'Humanité, Ouest-France, all clients"
  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this?
      options:
        - Nice to have
        - Important
        - Blocking a launch or client
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, or links.
